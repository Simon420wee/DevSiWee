<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#a78bfa"/>
      <stop offset="50%"  stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="32" height="32" rx="7" fill="#00040e"/>

  <!-- Glow layer -->
  <rect x="9" y="9" width="14" height="14" rx="2.5" fill="url(#g)" opacity="0.35" transform="rotate(45 16 16)" filter="url(#glow)"/>

  <!-- Diamond shape -->
  <rect x="9" y="9" width="14" height="14" rx="2.5" fill="url(#g)" transform="rotate(45 16 16)"/>
</svg>